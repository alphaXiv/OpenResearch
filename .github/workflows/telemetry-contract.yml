name: Verify production telemetry contract

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      source-sha:
        required: true
        type: string

jobs:
  verify:
    name: verify production telemetry contract
    if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit }}
    runs-on: ubuntu-22.04
    env:
      ORX_OFFICIAL_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source-sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify production accepts this release payload
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked telemetry::tests::production_contract_is_accepted -- --ignored --exact 2>&1 | tee /tmp/telemetry-contract.log
          grep -q "test telemetry::tests::production_contract_is_accepted ... ok" /tmp/telemetry-contract.log
