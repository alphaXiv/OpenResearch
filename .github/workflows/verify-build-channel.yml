name: Verify telemetry build channel

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  verify:
    name: verify build channel (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: artifacts

      - name: Verify packaged binary
        shell: bash
        env:
          EXPECTED_BUILD_CHANNEL: ${{ fromJson(inputs.plan).announcement_tag_is_implicit && 'development' || 'production' }}
          ORX_TELEMETRY_ENV: "off"
          TARGETS_JSON: ${{ toJson(matrix.targets) }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/orx-build-channel
        run: |
          set -euo pipefail
          verified=0
          while IFS= read -r -d '' archive; do
            extract_dir="extracted/$verified"
            mkdir -p "$extract_dir"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$extract_dir" 2>/dev/null || 7z x -y -o"$extract_dir" "$archive" > /dev/null ;;
              *) tar -xf "$archive" -C "$extract_dir" ;;
            esac
            binary="$(find "$extract_dir" -type f \( -name orx -o -name orx.exe \) -print -quit)"
            if [[ -z "$binary" ]]; then
              echo "::error::No orx binary found in '$archive'"
              exit 1
            fi
            chmod +x "$binary"
            actual="$("$binary" --no-telemetry version --build-channel)"
            if [[ "$actual" != "$EXPECTED_BUILD_CHANNEL" ]]; then
              echo "::error::Expected build channel '$EXPECTED_BUILD_CHANNEL', got '$actual' in '$archive'"
              exit 1
            fi
            verified=$((verified + 1))
          done < <(find artifacts -type f \( -name '*.tar.xz' -o -name '*.tar.gz' -o -name '*.zip' \) -print0)
          expected="$(jq 'length' <<< "$TARGETS_JSON")"
          if (( verified != expected )); then
            echo "::error::Expected $expected packaged archive(s), verified $verified"
            exit 1
          fi
