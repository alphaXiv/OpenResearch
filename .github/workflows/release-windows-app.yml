# Attaches the Windows desktop app installer (OpenResearch-Setup.exe) to a
# GitHub Release. It packages the release's own orx.exe with the launcher, so
# the app runs exactly the published CLI build, and that orx.exe keeps itself
# current through the CLI's self-update.
#
# Triggers: release.yml calls it once the release is published, or a manual
# dispatch names the tag. This fork's installer is unsigned (no
# alphaXiv signing account) and runs only in this repository. See docs/windows.md.

name: Attach Windows app to release

on:
  # release.yml calls this after publishing (a post-announce job), since its
  # GITHUB_TOKEN-dispatched runs would not fire a workflow_run.
  workflow_call:
    inputs:
      plan:
        description: dist's plan manifest (unused; the tag comes from Cargo.toml)
        required: true
        type: string
      tag:
        description: Release tag; empty means v<Cargo.toml version>
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Windows app to (e.g. v0.2.11)
        required: true
        type: string

permissions:
  contents: write # upload release assets

concurrency:
  group: release-windows-app
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.repository == 'artur-shaikhutdinov/OpenResearch-Kimi-MiniMax-ZCode' }}
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      tag: ${{ steps.gate.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - id: gate
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
            tag="v${version}"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::No release $tag found (dry-run dispatch?) — nothing to attach."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-app:
    needs: check
    if: ${{ needs.check.outputs.ok == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      # The runner's preinstalled stable toolchain.
      - name: Build the launcher
        run: cargo build --release --locked --manifest-path windows/launcher/Cargo.toml

      - name: Take orx.exe from the release
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern '*-x86_64-pc-windows-msvc.zip' --dir release-archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -Path (Get-ChildItem release-archive/*.zip | Select-Object -First 1) -DestinationPath release-unpacked
          New-Item -ItemType Directory -Force app-staging | Out-Null
          Copy-Item (Get-ChildItem release-unpacked -Recurse -Filter orx.exe | Select-Object -First 1).FullName app-staging
          Copy-Item windows/launcher/target/release/OpenResearch.exe app-staging

      # A development-channel build (no telemetry to alphaXiv) of this very tag.
      - name: Verify the packaged orx
        env:
          ORX_TELEMETRY_ENV: "off"
        run: |
          $channel = & app-staging/orx.exe version --build-channel
          if ($channel -ne 'development') { throw "expected build channel 'development', got '$channel'" }
          $version = (& app-staging/orx.exe --version) -replace '^\S+\s+', ''
          if ("v$version" -ne $env:TAG) { throw "orx.exe is $version, expected $env:TAG" }

      - name: Build the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DSourceDir=$PWD\app-staging" "/DOutputDir=$PWD\app-installer" windows\OpenResearch.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload the installer to the release
        run: |
          gh release upload $env:TAG app-installer/OpenResearch-Setup.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  refresh-downloads:
    needs: [check, windows-app]
    permissions:
      contents: write
    uses: ./.github/workflows/release-downloads.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
