name: Canary desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-desktop
  cancel-in-progress: false

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      changes: ${{ steps.identity.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/canary-identity.sh

  release-checks:
    needs: [identity, ui, build-host]
    uses: ./.github/workflows/release-checks.yml
    with:
      plan: '{}'
      source-sha: ${{ github.sha }}

  build-host:
    needs: identity
    uses: ./.github/workflows/build-host.yml
    with:
      source-sha: ${{ github.sha }}

  ui:
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          package-json-file: ui/package.json
          install: false
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ui
          path: ui/dist
          if-no-files-found: error

  macos-build:
    needs: [identity, ui, build-host]
    if: vars.MACOS_SIGNING_ENABLED == 'true'
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui
          path: ui/dist
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: canary-macos
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download release hosts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-host
          path: target/host-binaries
      - name: Build orx
        env:
          ORX_OFFICIAL_RELEASE_BUILD: '1'
          ORX_EMBED_HOST_DIR: ${{ github.workspace }}/target/host-binaries
          ORX_DESKTOP_CANARY_TAG: ${{ needs.identity.outputs.tag }}
          ORX_DESKTOP_CANARY_SHA: ${{ github.sha }}
          ORX_DESKTOP_CANARY_CHANGES: ${{ needs.identity.outputs.changes }}
        run: cargo build --release --locked --bin orx --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-macos-orx-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/orx
          if-no-files-found: error

  macos:
    needs: [identity, macos-build]
    if: vars.MACOS_SIGNING_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-macos-orx-*
          path: orx
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: ./.github/actions/macos-signing
        with:
          cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          notary-apple-id: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          notary-team-id: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          notary-password: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      - name: Assemble and sign app
        env:
          ORX_DESKTOP_CANARY_TAG: ${{ needs.identity.outputs.tag }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: orx-notary
        run: |
          lipo -create -output orx/universal orx/canary-macos-orx-aarch64-apple-darwin/orx orx/canary-macos-orx-x86_64-apple-darwin/orx
          ORX_APP_BINARY=orx/universal bash scripts/build-macos-app.sh
          test "$(dist/OpenResearch.app/Contents/MacOS/OpenResearch --no-telemetry version --build-channel)" = production
          test "$(dist/OpenResearch.app/Contents/MacOS/OpenResearch --no-telemetry version --build-id)" = "$ORX_DESKTOP_CANARY_TAG"
          bash scripts/package-macos-app.sh
      - name: Sign, notarize and package the CLIs
        env:
          ORX_DESKTOP_CANARY_TAG: ${{ needs.identity.outputs.tag }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          mkdir -p cli/notarize
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "cli/$target"
            cp "orx/canary-macos-orx-$target/orx" "cli/$target/orx"
            chmod 755 "cli/$target/orx"
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "cli/$target/orx"
            # Same requirement src/updates/macos_app.rs pins, so a wrong identity fails here.
            codesign --verify --strict --verbose=2 \
              -R='anchor apple generic and certificate leaf[subject.OU] = "9P69UXUJUK" and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' \
              "cli/$target/orx"
            cp "cli/$target/orx" "cli/notarize/orx-$target"
          done
          test "$(cli/aarch64-apple-darwin/orx --no-telemetry version --build-channel)" = production
          test "$(cli/aarch64-apple-darwin/orx --no-telemetry version --build-id)" = "$ORX_DESKTOP_CANARY_TAG"
          # A bare binary can't carry a stapled ticket; Gatekeeper finds it online.
          ditto -c -k cli/notarize "$RUNNER_TEMP/cli.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/cli.zip" --keychain-profile orx-notary --wait --timeout 25m --output-format json)" || true
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" --keychain-profile orx-notary || true
            echo "::error::Notarization of the canary CLIs was not accepted"
            exit 1
          fi
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="dist/OpenResearch-cli-$target.tar.gz"
            COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -czf "$archive" -C "cli/$target" orx
            shasum -a 256 "$archive" | cut -d' ' -f1 > "$archive.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-macos
          path: |
            dist/OpenResearch.dmg
            dist/OpenResearch-cli-*
          if-no-files-found: error

  # Static like the stable CLI archives, so a remote machine needs no desktop libraries.
  linux-cli:
    needs: [identity, ui, build-host]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui
          path: ui/dist
      - run: rustup toolchain install --no-self-update --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: canary-linux-cli
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Install musl cross linker
        run: cargo install cargo-zigbuild --locked --version 0.23.4
      - name: Download release hosts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-host
          path: target/host-binaries
      - name: Build orx
        env:
          TARGET: ${{ matrix.target }}
          ORX_OFFICIAL_RELEASE_BUILD: '1'
          ORX_EMBED_HOST_DIR: ${{ github.workspace }}/target/host-binaries
          ORX_DESKTOP_CANARY_TAG: ${{ needs.identity.outputs.tag }}
          ORX_DESKTOP_CANARY_SHA: ${{ github.sha }}
          ORX_DESKTOP_CANARY_CHANGES: ${{ needs.identity.outputs.changes }}
        run: |
          cargo zigbuild --release --locked --bin orx --target "$TARGET"
          orx="target/$TARGET/release/orx"
          test "$("$orx" --no-telemetry version --build-channel)" = production
          test "$("$orx" --no-telemetry version --build-id)" = "$ORX_DESKTOP_CANARY_TAG"
          linked="$(ldd "$orx" 2>&1 || true)"
          case "$linked" in
            *"not a dynamic executable"* | *"statically linked"*) ;;
            *) echo "::error::The headless orx links shared libraries: $linked"; exit 1 ;;
          esac
          mkdir -p cli-dist
          archive="cli-dist/OpenResearch-cli-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" orx
          sha256sum "$archive" | cut -d' ' -f1 > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-cli-${{ matrix.target }}
          path: cli-dist/OpenResearch-cli-*
          if-no-files-found: error

  linux:
    needs: [identity, ui, build-host]
    if: vars.LINUX_APP_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui
          path: ui/dist
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev file patchelf xvfb xdotool
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: canary-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download release hosts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-host
          path: target/host-binaries
      - name: Build app
        env:
          ORX_OFFICIAL_RELEASE_BUILD: '1'
          ORX_EMBED_HOST_DIR: ${{ github.workspace }}/target/host-binaries
          ORX_DESKTOP_CANARY_TAG: ${{ needs.identity.outputs.tag }}
          ORX_DESKTOP_CANARY_SHA: ${{ github.sha }}
          ORX_DESKTOP_CANARY_CHANGES: ${{ needs.identity.outputs.changes }}
        run: |
          cargo build --release --locked --features desktop
          test "$(target/release/orx --no-telemetry version --build-channel)" = production
          test "$(target/release/orx --no-telemetry version --build-id)" = "$ORX_DESKTOP_CANARY_TAG"
          scripts/build-linux-appimage.sh target/release/orx app-dist
          sudo apt-get remove -y libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0
          scripts/smoke-test-linux-appimage.sh app-dist/OpenResearch-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-linux-${{ matrix.arch }}
          path: app-dist/OpenResearch-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  windows:
    needs: [identity, ui, build-host]
    if: vars.WINDOWS_APP_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui
          path: ui/dist
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: canary-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            windows/launcher -> target
      - name: Download release hosts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-host
          path: target/host-binaries
      - name: Build app
        env:
          ORX_OFFICIAL_RELEASE_BUILD: '1'
          ORX_EMBED_HOST_DIR: ${{ github.workspace }}/target/host-binaries
          ORX_DESKTOP_CANARY_TAG: ${{ needs.identity.outputs.tag }}
          ORX_DESKTOP_CANARY_SHA: ${{ github.sha }}
          ORX_DESKTOP_CANARY_CHANGES: ${{ needs.identity.outputs.changes }}
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path windows/launcher/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force app-staging, app-dist | Out-Null
          Copy-Item target/release/orx.exe app-staging/orx.exe
          Copy-Item windows/launcher/target/release/OpenResearch.exe app-staging/OpenResearch.exe
          if ((& app-staging/orx.exe --no-telemetry version --build-channel) -ne 'production') { throw 'Not a production build' }
          if ((& app-staging/orx.exe --no-telemetry version --build-id) -ne $env:ORX_DESKTOP_CANARY_TAG) { throw 'Incorrect canary build identity' }
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.WINDOWS_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign the app
        uses: ./.github/actions/windows-signing
        with:
          files: |
            ${{ github.workspace }}\app-staging\OpenResearch.exe
            ${{ github.workspace }}\app-staging\orx.exe
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          account: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          profile: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      - name: Package the installer
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          Copy-Item app-staging/orx.exe app-dist/OpenResearch-Canary-orx.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\app-staging" "/DOutputDir=$PWD\app-dist" windows\OpenResearch.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign the installer
        uses: ./.github/actions/windows-signing
        with:
          files: ${{ github.workspace }}\app-dist\OpenResearch-Setup.exe
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          account: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          profile: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-windows
          path: app-dist/OpenResearch-*.exe
          if-no-files-found: error

  publish:
    needs: [identity, release-checks, ui, linux-cli, macos-build, macos, linux, windows]
    if: '!cancelled() && needs.identity.result == ''success'' && needs.release-checks.result == ''success'' && needs.ui.result == ''success'' && needs.linux-cli.result == ''success'' && (needs.macos-build.result == ''success'' || needs.macos-build.result == ''skipped'') && (needs.macos.result == ''success'' || needs.macos.result == ''skipped'') && (needs.linux.result == ''success'' || needs.linux.result == ''skipped'') && (needs.windows.result == ''success'' || needs.windows.result == ''skipped'') && (needs.macos.result == ''success'' || needs.linux.result == ''success'' || needs.windows.result == ''success'')'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.identity.outputs.tag }}
      VERSION: ${{ needs.identity.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      CANARY_CHANGES: ${{ needs.identity.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-cli-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-macos
          path: artifacts
          merge-multiple: true
        if: needs.macos.result == 'success'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-linux-*
          path: artifacts
          merge-multiple: true
        if: needs.linux.result == 'success'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-windows
          path: artifacts
          merge-multiple: true
        if: needs.windows.result == 'success'
      - name: Publish canary
        run: scripts/canary-publish.sh
      - name: Retain seven canary builds
        run: scripts/canary-retain.sh
