name: Verify Windows sign-in diagnostics
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 8e1e1745bdabc23353f207d79b06ee9222317001
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14383180091
          run-id: 44201407204
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orx-hosts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Fetch verified vendor and baseline programs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = $env:RUNNER_TEMP
          $zip = "$r/orx-release.zip"
          curl.exe --fail --silent --show-error --location --retry 2 --output $zip https://github.com/alphaXiv/OpenResearch/releases/download/v0.2.27/openresearch-cli-x86_64-pc-windows-msvc.zip
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip).Hash -ne 'e1ccafb4fa99aae14f29ec380923fea57d7280111ea01b0e2e4c33ff74469bd0') { throw 'Invalid baseline archive' }
          Expand-Archive $zip "$r/orx-before"
          $baseline = (Get-ChildItem "$r/orx-before" -Filter orx.exe -Recurse | Select-Object -First 1).FullName
          if (-not $baseline) { throw 'Missing baseline CLI' }
          $tar = "$r/codex-package.tar.gz"
          curl.exe --fail --silent --show-error --location --retry 2 --output $tar https://releases.openai.com/codex/releases/0.169.1/codex-package-x86_64-pc-windows-msvc.tar.gz
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $tar).Hash -ne '6fafb4a62e9d784eaeebabd3b1aa2539d48af753693f62800d73884fbf85600e') { throw 'Invalid vendor archive' }
          New-Item -ItemType Directory -Path "$r/vendor" | Out-Null
          tar.exe -xzf $tar -C "$r/vendor"
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack vendor CLI' }
          $codex = (Get-ChildItem "$r/vendor" -Filter codex.exe -Recurse | Select-Object -First 1).FullName
          if (-not $codex) { throw 'Missing vendor CLI' }
          "ORX_BEFORE=$baseline" >> $env:GITHUB_ENV
          "PROOF_CODEX=$codex" >> $env:GITHUB_ENV
          & $codex --version
      - name: Build actual PR commit with release telemetry
        working-directory: candidate
        env:
          ORX_OFFICIAL_RELEASE_BUILD: '1'
          ORX_EMBED_HOST_DIR: ${{ runner.temp }}/orx-hosts
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build --locked --bin orx
      - name: Run the same real setup request twice and capture receipts
        run: node evidence/proof/verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-Codex-setup-receipts
          path: receipts/
          if-no-files-found: error
