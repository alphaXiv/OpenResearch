name: OpenCode native setup evidence
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      ORX_OFFICIAL_RELEASE_BUILD: '1'
      ORX_EMBED_HOST_DIR: ${{ runner.temp }}/orx-hosts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: product
          ref: 2567ddf9eb09c6acedc150e6f5c82e5b1b0262a1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14383180091
          run-id: 44201407204
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orx-hosts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Exercise the same workflow on unmodified commits
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'base 2567ddf9eb09c6acedc150e6f5c82e5b1b0262a1' 'fixed 1c3f67869058440272aa505eb008ae4385860edb' 'origin 9bbd3555d56d2383007df7128d3ce111a772f644'; do
            read -r label sha <<< "$pair"
            git -C product fetch --depth=1 origin "$sha"
            git -C product checkout --detach "$sha"
            test "$(git -C product rev-parse HEAD)" = "$sha"
            (cd product && cargo build --locked --bin orx)
            ext=''; if [[ "$RUNNER_OS" == Windows ]]; then ext='.exe'; fi
            node evidence/proof/opencode.mjs "$label" "$sha" "product/target/debug/orx$ext"
          done
      - name: Render actual captured setup receipts
        run: |
          python -m pip install Pillow==11.3.0
          python evidence/proof/media.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-opencode-${{ runner.os }}
          path: evidence-opencode/
          if-no-files-found: error
