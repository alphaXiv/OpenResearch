name: Native Windows managed-install evidence
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: product
          ref: 708872db4618b403258ef2d706e3a025cc7ac2fe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14383180091
          run-id: 44201407204
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orx-hosts
          merge-multiple: true
      - name: Build production-identity candidate; never publish test binaries
        working-directory: product
        env:
          ORX_OFFICIAL_RELEASE_BUILD: "1"
          ORX_EMBED_HOST_DIR: ${{ runner.temp }}/orx-hosts
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --bin orx
      - name: Run real Windows install requests, capturing only safe evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP 'baseline.zip'
          Invoke-WebRequest -Uri 'https://github.com/alphaXiv/OpenResearch/releases/download/v0.2.27/openresearch-cli-x86_64-pc-windows-msvc.zip' -OutFile $base
          if ((Get-FileHash $base -Algorithm SHA256).Hash -ne 'e1ccafb4fa99aae14f29ec380923fea57d7280111ea01b0e2e4c33ff74469bd0') { throw 'release integrity mismatch' }
          $dir=Join-Path $env:RUNNER_TEMP 'baseline'
          Expand-Archive $base -DestinationPath $dir
          $before=(Get-ChildItem $dir -Recurse -Filter 'orx.exe' | Select-Object -First 1).FullName
          $after=(Resolve-Path 'product/target/debug/orx.exe').Path
          $proof=Join-Path $env:RUNNER_TEMP 'proof'
          node evidence/scripts/proof-managed-install.mjs $before $after $proof 708872db4618b403258ef2d706e3a025cc7ac2fe
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $edge="${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $uri=[Uri]::new((Join-Path $proof 'capture.html')).AbsoluteUri
          $image=Join-Path $proof 'windows-before-after.png'
          $args=@('--headless=new','--disable-gpu','--no-first-run','--hide-scrollbars','--window-size=1220,980',"--user-data-dir=$env:RUNNER_TEMP\orx-evidence-edge","--screenshot=$image",$uri)
          $p=Start-Process $edge -ArgumentList $args -PassThru -Wait
          if (!(Test-Path $image)) {throw "receipt screenshot missing: $($p.ExitCode)"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-windows-claude-install-receipt
          path: |
            ${{ runner.temp }}/proof/receipt.json
            ${{ runner.temp }}/proof/windows-before-after.png
          if-no-files-found: error
          retention-days: 14
