name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the suite against a branch before it has a PR — the Windows job below
  # is the only Windows machine most changes will meet.
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Cancel superseded PR/push checks without cancelling independent releases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Localization catalogs
        run: node ui/scripts/check-i18n.mjs

      - name: Style tokens
        run: node ui/scripts/check-styles.mjs

      - name: Dev-slot helper tests
        run: node --test scripts/dev-slot.test.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Generate localized messages
        working-directory: ui
        run: pnpm exec paraglide-js compile --silent --emit-ts-declarations

      - name: UI typecheck
        working-directory: ui
        run: pnpm typecheck

      - name: UI unit tests
        run: node --test --experimental-strip-types ui/tests/*.test.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Source builds cannot enable production telemetry
        shell: bash
        run: |
          set -euo pipefail
          test "$(target/debug/orx --no-telemetry version --build-channel)" = "development"
          cargo build --release --locked
          test "$(target/release/orx --no-telemetry version --build-channel)" = "development"

      - name: Test
        run: cargo test --locked

  # Only what differs by platform: the checks above are platform-independent,
  # and ui/dist is committed, so no Node here.
  windows:
    name: windows build, test
    # `plan` is only ever passed by release.yml, so this keeps Windows gating
    # pull requests without letting a regression there hold up a macOS or Linux
    # release, which ships no Windows artifact.
    if: ${{ !inputs.plan }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Upload orx.exe
        uses: actions/upload-artifact@v4
        with:
          name: orx-windows-x86_64-debug
          path: target/debug/orx.exe
          if-no-files-found: error

  # Guards the version-bump release flow (release-on-bump.yml): the version in
  # Cargo.toml may only move forward, may not reuse an already-released tag,
  # and a bump must come with a regenerated Cargo.lock. Catching these here
  # means a malformed bump can't reach main, where merging it would be the
  # release trigger.
  version-guard:
    name: version sanity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version must move forward (with a fresh lockfile)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          pkg_version() { grep -m1 '^version = ' "$1" | sed -E 's/version = "(.*)"/\1/'; }

          git show "${BASE_SHA}:Cargo.toml" > /tmp/base-Cargo.toml
          base=$(pkg_version /tmp/base-Cargo.toml)
          head=$(pkg_version Cargo.toml)
          echo "base: ${base}  pr: ${head}"

          if [ "${head}" = "${base}" ]; then
            echo "No version change — OK (merging this PR will not release)."
            exit 0
          fi

          # Reject a version that sorts at or below the base (semver-aware sort).
          if [ "$(printf '%s\n%s\n' "${base}" "${head}" | sort -V | head -1)" = "${head}" ]; then
            echo "::error::Version went backwards: ${base} -> ${head}."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${head}" >/dev/null 2>&1; then
            echo "::error::v${head} is already a released tag; bump past it."
            exit 1
          fi

          # A bump must carry a regenerated lockfile, or release builds
          # (--locked) would fail.
          if ! grep -A1 '^name = "openresearch-cli"$' Cargo.lock | grep -q "version = \"${head}\""; then
            echo "::error::Cargo.toml says ${head} but Cargo.lock was not regenerated (run cargo build and commit the lockfile)."
            exit 1
          fi

          echo "Version bump ${base} -> ${head} looks good. Merging this PR WILL cut release v${head}."
