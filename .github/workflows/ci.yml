name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Required by cargo-dist's custom-ci calling convention.
      plan:
        required: true
        type: string
      source-sha:
        required: false
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      rust: ${{ steps.changes.outputs.rust }}
      windows: ${{ steps.changes.outputs.windows }}
      linux: ${{ steps.changes.outputs.linux }}
      macos: ${{ steps.changes.outputs.macos }}
      dev: ${{ steps.changes.outputs.dev }}
      chart: ${{ steps.changes.outputs.chart }}
      release_notes: ${{ steps.changes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
          fetch-depth: 2
      - name: Select checks for changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.source-sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || inputs.plan != '' }}
        run: node scripts/ci-changes.mjs

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Script tests
        run: node --test 'scripts/*.test.mjs'
      - name: Workflow lint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
          pipx run zizmor==1.31.1 --offline --format github .github

  frontend:
    name: Frontend (${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: build
          - check: test 1/2
            shard: 1/2
          - check: test 2/2
            shard: 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Localization catalogs
        run: node ui/scripts/check-i18n.mjs
      - name: Style tokens
        run: node ui/scripts/check-styles.mjs
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          package-json-file: ui/package.json
          install: false
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Build UI
        if: matrix.check == 'build'
        working-directory: ui
        run: pnpm exec vite build
      - name: UI typecheck
        if: matrix.check == 'build'
        working-directory: ui
        run: pnpm typecheck
      - name: UI unit tests
        if: matrix.shard != ''
        working-directory: ui
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}
        run: pnpm test

  helpers:
    name: Helper tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.dev == 'true' || needs.changes.outputs.chart == 'true' || needs.changes.outputs.release_notes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Shared SSH helper protocol tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          python3 scripts/test_ssh_helper.py
          for image in \
            python:3.6.15-slim-buster@sha256:e10aa83604948c6d8d9f72a9a20193d84bb2dbe550b725eb5208387117fde065 \
            python:3.7.17-slim-bullseye@sha256:603879aeff06df23f0d392a19f7ce02aa85e14e6b4d25fd9647b116e0cb93467 \
            python:3.8.20-slim-bookworm@sha256:1d52838af602b4b5a831beb13a0e4d073280665ea7be7f69ce2382f29c5a613f; do
            docker run --rm --network none \
              -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
              "$image" python scripts/test_ssh_helper.py
          done
      - name: Embedded JavaScript tests
        if: needs.changes.outputs.rust == 'true'
        run: node --test 'src/**/*.test.mjs'
      - name: Dev script tests
        if: needs.changes.outputs.dev == 'true'
        run: node --test --experimental-strip-types scripts/dev.test.ts
      - name: Interactive chart authoring tests
        if: needs.changes.outputs.chart == 'true'
        run: python3 scripts/test_orx_chart.py
      - name: Release notes composition
        if: needs.changes.outputs.release_notes == 'true'
        run: python3 scripts/test_release_notes.py

  rust-lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-lint
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path windows/launcher/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  rust:
    name: Rust (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"test1","partition":"slice:1/2"},{"name":"test2","partition":"slice:2/2"}]' || '[{"name":"all","partition":""}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      # Installs alongside the toolchain and cache restores; the test step waits for it.
      - name: Start installing OpenSSH server and zsh
        run: |
          {
            sudo apt-get update &&
              sudo apt-get install -y --no-install-recommends openssh-server zsh &&
              sudo mkdir -p /run/sshd
            echo $? > "$RUNNER_TEMP/apt.status"
          } > "$RUNNER_TEMP/apt.log" 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: ${{ matrix.name != 'test2' }}
      - name: Cache incremental compilation
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        env: &linux-incremental-key
          INCREMENTAL_KEY: incremental-linux-test-v1-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/config.toml') }}
        with: &linux-incremental-cache
          path: target/debug/incremental
          key: ${{ env.INCREMENTAL_KEY }}-${{ github.event.pull_request.base.sha || inputs.source-sha || github.sha }}
          restore-keys: ${{ env.INCREMENTAL_KEY }}-
      - name: Restore incremental compilation
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env: *linux-incremental-key
        with: *linux-incremental-cache
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Finish installing OpenSSH server and zsh
        run: |
          until [ -e "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"
        timeout-minutes: 5
      - name: Test
        env:
          CARGO_INCREMENTAL: 1
          PARTITION: ${{ matrix.partition }}
        run: |
          args=()
          if [ -n "$PARTITION" ]; then
            args+=(--partition "$PARTITION")
          fi
          cargo nextest run --locked --profile ci "${args[@]}"
        timeout-minutes: 30
      - name: Doc-tests
        if: matrix.name != 'test2'
        env:
          CARGO_INCREMENTAL: 1
        run: cargo test --locked --doc
        timeout-minutes: 30
      - name: Source builds disable production telemetry
        if: matrix.name != 'test2'
        shell: bash
        run: test "$(target/debug/orx --no-telemetry version --build-channel)" = "development"

  e2e:
    name: End-to-end
    needs: changes
    # e2e/ is unclassified, so a change there selects every check, these two included.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          package-json-file: e2e/package.json
          install: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - name: Cache incremental compilation
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        env: &e2e-incremental-key
          INCREMENTAL_KEY: incremental-linux-e2e-v1-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/config.toml') }}
        with: &e2e-incremental-cache
          path: target/debug/incremental
          key: ${{ env.INCREMENTAL_KEY }}-${{ github.event.pull_request.base.sha || inputs.source-sha || github.sha }}
          restore-keys: ${{ env.INCREMENTAL_KEY }}-
      - name: Restore incremental compilation
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env: *e2e-incremental-key
        with: *e2e-incremental-cache
      # Compiles while dependencies install; the run's own build reports any error.
      - name: Start building orx
        env:
          CARGO_INCREMENTAL: 1
        run: cargo build --locked > "$RUNNER_TEMP/build.log" 2>&1 &
      - name: Install dependencies
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Harness checks
        run: |
          pnpm --dir e2e typecheck
          node --test e2e/lint.test.ts
      - name: End-to-end tests
        env:
          CARGO_INCREMENTAL: 1
        run: node e2e/run.ts
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  linux-app:
    name: linux app (${{ matrix.arch }}, ${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"arch":"x86_64","mode":"lint"},{"arch":"x86_64","mode":"test"},{"arch":"aarch64","mode":"lint"},{"arch":"aarch64","mode":"test"}]' || '[{"arch":"x86_64","mode":"all"},{"arch":"aarch64","mode":"all"}]') }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      # Installs alongside the toolchain and cache restores; "Finish installing WebKitGTK" waits for it.
      - name: Start installing WebKitGTK
        run: |
          {
            sudo apt-get update &&
              sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev openssh-server zsh &&
              sudo mkdir -p /run/sshd
            echo $? > "$RUNNER_TEMP/apt.status"
          } > "$RUNNER_TEMP/apt.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-app-dev
          save-if: ${{ matrix.mode != 'lint' }}
      - name: Cache incremental compilation
        if: matrix.mode != 'lint' && github.ref == 'refs/heads/main'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        env: &desktop-incremental-key
          INCREMENTAL_KEY: incremental-linux-desktop-dev-v1-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/config.toml') }}
        with: &desktop-incremental-cache
          path: target/debug/incremental
          key: ${{ env.INCREMENTAL_KEY }}-${{ github.event.pull_request.base.sha || inputs.source-sha || github.sha }}
          restore-keys: ${{ env.INCREMENTAL_KEY }}-
      - name: Restore incremental compilation
        if: matrix.mode != 'lint' && github.ref != 'refs/heads/main'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env: *desktop-incremental-key
        with: *desktop-incremental-cache
      - name: Install nextest
        if: matrix.mode != 'lint'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Finish installing WebKitGTK
        run: |
          until [ -e "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"
        timeout-minutes: 5
      - name: Clippy
        if: matrix.mode != 'test'
        run: cargo clippy --all-targets --locked --features desktop -- -D warnings
      - name: Test
        if: matrix.mode != 'lint'
        env:
          CARGO_INCREMENTAL: 1
        run: cargo nextest run --locked --profile ci --features desktop
        timeout-minutes: 30

  windows:
    name: windows (${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [lint, test1, test2, test3, test4, test5, test6, integration, demo, onboarding, chat]
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      NEXTEST_TEST_THREADS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      # Installs while the Dev Drive is set up; "Finish installing Rust" waits for it.
      - name: Start installing Rust
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'rustup.ps1'
          Set-Content -LiteralPath $script -Value @'
          $log = "$env:RUNNER_TEMP\rustup.log"
          rustup toolchain install --no-self-update *>> $log
          Set-Content -LiteralPath "$env:RUNNER_TEMP\rustup.status.tmp" -Value $LASTEXITCODE
          Move-Item -LiteralPath "$env:RUNNER_TEMP\rustup.status.tmp" -Destination "$env:RUNNER_TEMP\rustup.status"
          '@
          Start-Process pwsh -WindowStyle Hidden -WorkingDirectory $env:GITHUB_WORKSPACE -ArgumentList '-NoProfile', '-File', $script
      # Tests create their git repositories under TEMP, so it moves to the Dev Drive too.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 20GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}\.cargo
            TMP,{{ DEV_DRIVE }}\tmp
            TEMP,{{ DEV_DRIVE }}\tmp
      - run: New-Item -ItemType Directory -Force $env:TMP | Out-Null
      - name: Finish installing Rust
        run: |
          $status = "$env:RUNNER_TEMP\rustup.status"
          while (-not (Test-Path -LiteralPath $status)) { Start-Sleep -Milliseconds 250 }
          Get-Content -LiteralPath "$env:RUNNER_TEMP\rustup.log"
          exit ([int](Get-Content -LiteralPath $status))
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-${{ env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER }}${{ matrix.mode == 'lint' && '-lint' || '' }}
          save-if: ${{ matrix.mode == 'lint' || matrix.mode == 'test1' }}
          cache-on-failure: true
          workspaces: |
            ${{ env.DEV_DRIVE_WORKSPACE }} -> target
            ${{ env.DEV_DRIVE_WORKSPACE }}/windows/launcher -> target
      # A warm registry skips revalidating the crate index before every build.
      - name: Use the restored crate registry
        run: |
          cargo fetch --locked --offline --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -eq 0) { 'CARGO_NET_OFFLINE=true' >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Restore incremental compilation
        if: matrix.mode != 'lint'
        id: incremental
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env:
          INCREMENTAL_KEY: incremental-windows-test-debug0-${{ env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER }}-v1-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/config.toml') }}
        with:
          path: &windows-incremental-path ${{ env.DEV_DRIVE_WORKSPACE }}/target/debug/incremental
          key: ${{ env.INCREMENTAL_KEY }}-${{ github.event.pull_request.base.sha || inputs.source-sha || github.sha }}
          restore-keys: ${{ env.INCREMENTAL_KEY }}-
      - name: Clippy
        if: matrix.mode == 'lint'
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Format app launcher
        if: matrix.mode == 'lint'
        run: cargo fmt --manifest-path windows/launcher/Cargo.toml --check
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Clippy (app launcher)
        if: matrix.mode == 'lint'
        run: cargo clippy --manifest-path windows/launcher/Cargo.toml --all-targets --locked -- -D warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Build app launcher
        if: matrix.mode == 'lint'
        run: cargo build --manifest-path windows/launcher/Cargo.toml --locked
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Test app launcher
        if: matrix.mode == 'lint'
        run: cargo test --manifest-path windows/launcher/Cargo.toml --locked
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Build tests
        if: matrix.mode == 'test1' && github.ref == 'refs/heads/main'
        id: test-build
        env: &windows-test-env
          CARGO_INCREMENTAL: 1
          CARGO_PROFILE_TEST_DEBUG: 0
          RUST_TEST_THREADS: 16
          TEST_MODE: ${{ matrix.mode }}
        run: cargo test --locked --no-run
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Install nextest
        if: startsWith(matrix.mode, 'test') || matrix.mode == 'integration'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Test
        if: matrix.mode != 'lint'
        env: *windows-test-env
        run: |
          $binary = 'orx'
          if ($env:TEST_MODE -eq 'integration') {
            $metadataJson = cargo metadata --locked --no-deps --format-version 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $metadata = $metadataJson | ConvertFrom-Json
            $targetArgs = @('--lib', '--test', '*')
            foreach ($package in $metadata.packages) {
              if ($package.id -notin $metadata.workspace_default_members) { continue }
              foreach ($target in $package.targets) {
                if ($target.test -and 'bin' -in $target.kind -and $target.name -cne $binary) {
                  $targetArgs += @('--bin', $target.name)
                }
              }
            }
            cargo nextest run --locked --profile ci @targetArgs
            exit $LASTEXITCODE
          }
          $filters = @{
            demo = 'local::demo::tests::'
            onboarding = 'local::demo::tests::prewarmed_onboarding_seeds_full_demo'
            chat = 'local::chat::'
          }
          $partitions = @{
            test1 = 1
            test2 = 2
            test3 = 3
            test4 = 4
            test5 = 5
            test6 = 6
          }
          $testArgs = @('--locked')
          if ($filters.ContainsKey($env:TEST_MODE)) {
            $filter = $filters[$env:TEST_MODE]
            $testArgs += @('--bin', $binary, $filter, '--')
            foreach ($nested in $filters.Values) {
              if ($nested -ne $filter -and $nested.StartsWith($filter)) {
                $testArgs += @('--skip', $nested)
              }
            }
          } elseif ($partitions.ContainsKey($env:TEST_MODE)) {
            $excluded = ($filters.Values | ForEach-Object { "test($_)" }) -join ' | '
            $partition = "slice:$($partitions[$env:TEST_MODE])/$($partitions.Count)"
            cargo nextest run --locked --profile ci --bin $binary --partition $partition -E "not (kind(bin) & binary(=$binary) & ($excluded))"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:TEST_MODE -ne 'test1') { exit 0 }
            $testArgs += '--doc'
          }
          cargo test @testArgs
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        timeout-minutes: 30
      - name: Save incremental compilation
        if: always() && github.ref == 'refs/heads/main' && matrix.mode == 'test1' && steps.test-build.outcome == 'success' && steps.incremental.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: *windows-incremental-path
          key: ${{ steps.incremental.outputs.cache-primary-key }}

  check:
    name: fmt, clippy, test
    if: always()
    needs: [changes, workflow-lint, frontend, helpers, rust-lint, rust, e2e, linux-app, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha || github.sha }}
      - name: Verify all selected checks passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FLAGS_JSON: ${{ toJSON(needs.changes.outputs) }}
        run: node scripts/ci-check-result.mjs

  # Guards the version-bump release flow (release-on-bump.yml): the version in
  # Cargo.toml may only move forward, may not reuse an already-released tag,
  # and a bump must come with a regenerated Cargo.lock. Catching these here
  # means a malformed bump can't reach main, where merging it would be the
  # release trigger.
  version-guard:
    name: version sanity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Version must move forward (with a fresh lockfile)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          pkg_version() { grep -m1 '^version = ' "$1" | sed -E 's/version = "(.*)"/\1/'; }

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "${BASE_SHA}:Cargo.toml" > /tmp/base-Cargo.toml
          base=$(pkg_version /tmp/base-Cargo.toml)
          head=$(pkg_version Cargo.toml)
          echo "base: ${base}  pr: ${head}"

          if [ "${head}" = "${base}" ]; then
            echo "No version change — OK (merging this PR will not release)."
            exit 0
          fi

          # Reject a version that sorts at or below the base (semver-aware sort).
          if [ "$(printf '%s\n%s\n' "${base}" "${head}" | sort -V | head -1)" = "${head}" ]; then
            echo "::error::Version went backwards: ${base} -> ${head}."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${head}" >/dev/null 2>&1; then
            echo "::error::v${head} is already a released tag; bump past it."
            exit 1
          fi

          # A bump must carry a regenerated lockfile, or release builds
          # (--locked) would fail.
          if ! grep -A1 '^name = "openresearch-cli"$' Cargo.lock | grep -q "version = \"${head}\""; then
            echo "::error::Cargo.toml says ${head} but Cargo.lock was not regenerated (run cargo build and commit the lockfile)."
            exit 1
          fi

          echo "Version bump ${base} -> ${head} looks good. Merging this PR WILL cut release v${head}."
