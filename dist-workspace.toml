[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
pr-run-mode = "skip"
# Mark only publishing builds and verify every packaged binary before hosting.
github-build-setup = "../build-setup.yml"
# Sign platform archives before the global build checksums them.
local-artifacts-jobs = ["./sign-macos-cli", "./sign-windows-cli"]
# release.yml is hand-edited (source pinning, release-only triggers, signing dependencies,
# release checks beside the builds), so dist skips it; see macos/DISTRIBUTION.md before changing dist config.
allow-dirty = ["ci"]
# Verify packaged binaries, release-only builds and source CI before publishing. release.yml
# starts the checks with the builds, which dist cannot express: its plan jobs would gate the
# builds instead.
global-artifacts-jobs = ["./verify-build-channel", "./telemetry-contract", "./ci", "./release-checks"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Keep the shell installer usable on minimal Linux hosts without xz-utils.
unix-archive = ".tar.gz"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Trigger releases via workflow_dispatch instead of tag push. The tag is
# created implicitly when the GitHub Release is published at the end, so no
# workflow ever pushes a tag — which lets release-on-bump.yml dispatch
# releases with the default GITHUB_TOKEN (workflow_dispatch is exempt from
# GitHub's "GITHUB_TOKEN events don't trigger workflows" rule; tag pushes are
# not). No PAT or extra secret required.
dispatch-releases = true

# dist defaults arm64 macOS to macos-14, which GitHub is retiring.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"
