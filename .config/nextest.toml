[profile.ci]
test-threads = 16
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
# Non-dumpable processes make concurrent cancellation proofs unverifiable.
filter = 'package(orx-host) & binary(wrapper) & (test(nondumpable) | test(unreadable_environment))'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary(cli) | test(gigabyte_random_pages_survive_one_hundred_reconnects)'
priority = 100
