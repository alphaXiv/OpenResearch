    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong palette.
      // Storage key and resolution must match src/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("orx:theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
      // Resolve language before first paint; keep supported in sync with project.inlang/settings.json.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("orx:locale"); } catch (e) {}
        var browserPreferences = navigator.languages || [navigator.language];
        var supported = ["en", "zh-CN", "fa"];
        var match = function (tag) {
          if (!tag) return null;
          var normalized = String(tag).toLowerCase();
          for (var j = 0; j < supported.length; j += 1) {
            if (supported[j].toLowerCase() === normalized) return supported[j];
          }
          return null;
        };
        var locale = match(saved);
        for (var i = 0; !locale && i < browserPreferences.length; i += 1) {
          var preference = browserPreferences[i];
          locale = match(preference) || match(String(preference).split("-")[0]);
        }
        locale = locale || "en";
        document.documentElement.lang = locale;
        document.documentElement.dir = "ltr";
      })();
    </script>
