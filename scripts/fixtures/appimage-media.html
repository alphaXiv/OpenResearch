<script>
const report = (data) => parent.postMessage({mediaProbe: true, ...data}, '*');
try {
  const audio = new AudioContext();
  const sampleRate = audio.sampleRate;
  audio.close();
  const video = document.getElementById('video');
  video.addEventListener('error', () => report({pass: false, error: video.error?.message ?? 'video decode failed'}));
  video.addEventListener('loadeddata', () => {
    const context = document.getElementById('canvas').getContext('2d');
    context.drawImage(video, 0, 0);
    const pixel = [...context.getImageData(80, 45, 1, 1).data];
    report({pass: sampleRate > 0 && video.videoWidth === 160 && video.videoHeight === 90 && pixel[1] > 100 && pixel[0] < 20,
      sampleRate, videoWidth: video.videoWidth, videoHeight: video.videoHeight, pixel});
  }, {once: true});
} catch (error) { report({pass: false, error: String(error)}); }
</script></template>
<script>
window.addEventListener('message', event => {
  if (event.source === frame.contentWindow && event.data?.mediaProbe === true) window.webkit.messageHandlers.mediaProbe.postMessage(event.data);
});
const frame = document.createElement('iframe');
frame.sandbox = 'allow-scripts';
frame.srcdoc = '<!doctype html>' + document.getElementById('document').innerHTML;
document.body.append(frame);
</script>
